name: Repository checks

on:
  push:
  pull_request:

jobs:
  validate-public-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python source
        run: python -m compileall -q app

      - name: Reject private runtime artifacts
        shell: bash
        run: |
          forbidden="$(find . -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.exe' -o -name '*.msi' -o -name '*.whl' -o -name '*.zip' \) -print -quit)"
          if [ -n "$forbidden" ]; then
            echo "Private or binary artifact found: $forbidden"
            exit 1
          fi
